[project]
name = "evm-contract-auditor"
version = "2.0.0"
description = "Bytecode-first EVM contract audit engine"
requires-python = ">=3.11"
dependencies = [
  "cbor2>=5.6",
  "networkx>=3.0",
  "pyyaml>=6.0",
  "z3-solver>=4.12",
]

[project.optional-dependencies]
llm = [
  "openai>=1.40",
]
dev = [
  "hypothesis>=6.0",
  "httpx>=0.27",
  "mypy>=1.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pytest>=8.0",
  "pytest-timeout>=2.0",
  "ruff>=0.6",
  "structlog>=24.0",
  "tenacity>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
